<!DOCTYPE html>
<!-- Страница мастера Patriks. СОЗДАНА АВТОМАТИЧЕСКИ: node tools/generate.js
     Не правьте этот файл руками — правьте data/site.js и запустите скрипт заново -->
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Patriks , Dont Tell Mom Barbershop</title>
  <meta name="description" content="Patriks, DONT TELL MOM BARBERSHOP, Rīga.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600&family=Oswald:wght@500;700&display=swap">

  <link rel="stylesheet" href="../style.css?v=34">
  <link rel="stylesheet" href="../master.css?v=24">
  <link rel="stylesheet" href="../booking.css?v=25">

  <!-- Данные → общий скрипт сайта → страница мастера → виджет записи -->
  <script src="../data/site.js?v=26" defer></script>
  <script src="../script.js?v=40" defer></script>
  <script src="../master.js?v=26" defer></script>
  <script src="../booking.js?v=27" defer></script>
</head>
<!-- data-root: путь к корню сайта (для картинок и ссылок), data-master: чья страница -->
<body class="bp" data-root="../" data-master="patriks-2">


  <header class="header">
    <div class="header__inner container">
      <a href="../index.html" class="logo" data-config="shortName">DONT TELL MOM</a>

      <nav class="nav" id="nav" aria-label="Menu">
        <a href="#about" data-i18n="master.nav.about"></a>
        <a href="#works" data-i18n="master.nav.works"></a>
        <a href="#services" data-i18n="master.nav.services"></a>
        <a href="#contacts" data-i18n="master.nav.contacts"></a>
        <a href="../index.html#team" data-i18n="master.nav.team"></a>
        <button type="button" class="btn btn--dark nav__book" data-book data-i18n="common.book"></button>
      </nav>

      <div class="lang" role="group" aria-label="Language">
        <button type="button" class="lang__btn" data-lang="lv">LV</button>
        <button type="button" class="lang__btn" data-lang="ru">RU</button>
        <button type="button" class="lang__btn" data-lang="en">EN</button>
      </div>

      <button type="button" class="btn btn--dark header__book" data-book data-i18n="common.book"></button>

      <button type="button" class="burger" id="burger" aria-controls="nav" aria-expanded="false" data-i18n-aria="nav.open">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <main id="top">

    <!-- 1. Первый экран: фото (или инициалы), имя, запись -->
    <section class="bp-hero">
      <div class="container bp-hero__grid">
        <div class="bp-hero__photo bp-initials" aria-hidden="true">P</div>
        <div class="bp-hero__text">
          <a class="bp-back" href="../index.html#team" data-i18n="master.back"></a>
          <h1 class="bp-hero__name">Patriks</h1>
          <p class="bp-hero__role"><span data-master-field="role"></span> · <span data-config="name"></span></p>
          <button type="button" class="btn btn--dark" data-book data-i18n="common.book"></button>
        </div>
      </div>
    </section>

    <!-- 2. О мастере (пример) -->
    <section class="section" id="about">
      <div class="container bp-about">
        <div>
          <p class="label" data-i18n="master.about.label"></p>
          <h2 class="title" data-i18n="master.about.title"></h2>
        </div>
        <div class="bp-about__text">
          <p data-master-field="bio"></p>
        </div>
      </div>
    </section>

    <!-- 3. Специализации (пример) -->
    <section class="section bp-skills" id="skills">
      <div class="container">
        <p class="label" data-i18n="master.skills.label"></p>
        <h2 class="title" data-i18n="master.skills.title"></h2>
        <ul class="bp-tags" id="bp-tags"></ul>
      </div>
    </section>

    <!-- 4. Работы: 6 фото-примеров (gallery-*.jpg). Заменить на настоящие работы мастера -->
    <section class="section" id="works">
      <div class="container">
        <p class="label" data-i18n="master.works.label"></p>
        <h2 class="title" data-i18n="master.works.title"></h2>
        <div class="bp-works" id="bp-works"></div>
        <a class="bp-more" href="https://www.instagram.com/dtm.barbershop/" target="_blank" rel="noopener"><span data-i18n="master.works.more"></span> ↗︎</a>
      </div>
    </section>

    <!-- 5. Услуги и цены ЭТОГО мастера. «Записаться» открывает запись, где мастер уже выбран -->
    <section class="section bp-services" id="services">
      <div class="container">
        <p class="label" data-i18n="master.services.label"></p>
        <h2 class="title" data-i18n="master.services.title"></h2>
        <p class="bp-sample" data-i18n="master.services.note"></p>
        <div id="bp-services"></div>
      </div>
    </section>

    <!-- 6. Контакты -->
    <section class="section contacts" id="contacts">
      <div class="container">
        <p class="label" data-i18n="master.contacts.label"></p>
        <h2 class="title" data-i18n="master.contacts.title"></h2>
        <dl class="contacts__list" id="bp-contacts"></dl>
        <div class="contacts__actions">
          <button type="button" class="btn btn--dark" data-book data-i18n="common.book"></button>
          <a class="btn btn--outline" href="../index.html#team" data-i18n="master.back"></a>
        </div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <div>
        <p class="footer__logo" data-config="name"></p>
        <p data-i18n="footer.tagline"></p>
      </div>
      <div class="footer__links">
        <button type="button" class="footer__btn" data-book data-i18n="common.book"></button>
        <a href="../index.html" data-i18n="master.nav.site"></a>
      </div>
      <p class="footer__copy">© <span id="year"></span> <span data-config="name"></span></p>
    </div>
  </footer>

  <!-- Панель записи внизу экрана (телефон): выезжает, когда кнопка первого экрана ушла из виду -->
  <div class="bp-bar" id="bp-bar">
    <p class="bp-bar__info">
      <strong>Patriks</strong>
      <span data-config="name"></span>
    </p>
    <button type="button" class="btn btn--dark bp-bar__book" data-book data-i18n="common.book"></button>
  </div>

</body>
</html>
